                            <h2 className="font-heading text-4xl text-brand-maroon mb-4">Get In Touch</h2>
                            <p className="text-brand-gray">We are here to assist you with product enquiries, orders, and business partnerships.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="flex flex-col items-center text-center p-6 bg-brand-ivory rounded-2xl transition-transform hover:-translate-y-1">
                                <div className="text-brand-maroon mb-4 bg-white p-4 rounded-full shadow-sm"><Icons.MapPin /></div>
                                <h4 className="font-bold text-brand-charcoal mb-2">Location</h4>
                                <p className="text-sm text-brand-gray">{COMPANY_INFO.address}</p>
                            </div>
                            
                            <div className="flex flex-col items-center text-center p-6 bg-brand-ivory rounded-2xl transition-transform hover:-translate-y-1">
                                <div className="text-brand-maroon mb-4 bg-white p-4 rounded-full shadow-sm"><Icons.Phone /></div>
                                <h4 className="font-bold text-brand-charcoal mb-2">Call Us</h4>
                                <p className="text-sm text-brand-gray font-medium">{COMPANY_INFO.phoneFormatted}</p>
                                <a href={`tel:${COMPANY_INFO.phone}`} className="text-brand-maroon text-xs mt-2 hover:underline">Tap to call</a>
                            </div>
                            <div className="flex flex-col items-center text-center p-6 bg-brand-ivory rounded-2xl transition-transform hover:-translate-y-1 border border-green-100">
                                <div className="text-[#25D366] mb-4 bg-white p-4 rounded-full shadow-sm"><Icons.WhatsApp /></div>
                                <h4 className="font-bold text-brand-charcoal mb-2">WhatsApp</h4>
                                <p className="text-sm text-brand-gray">Instant replies for orders</p>
                                <a href={WHATSAPP_LINK} target="_blank" className="text-[#25D366] text-xs mt-2 hover:underline font-bold">Message Now</a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );
        const Footer = ({ navigate }) => (
            <footer className="bg-brand-charcoal text-brand-ivory pt-16 pb-8 border-t-4 border-brand-maroon">
                <div className="container mx-auto px-4">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-12 mb-12">
                        <div className="md:col-span-2">
                            <div className="mb-6">
                                <span className="font-heading font-bold text-3xl text-white tracking-wider block">ADITYA</span>
                                <span className="font-body text-sm tracking-[0.3em] text-brand-gold">PERFUMERY</span>
                            </div>
                            <p className="text-brand-ivory/70 max-w-sm text-sm leading-relaxed mb-6">
                                Premium Indian agarbatti and fragrance products crafted with devotion, purity, and unmatched quality. Based in Malegaon, Akola.
                            </p>
                        </div>
                        
                        <div>
                            <h4 className="font-heading text-lg text-brand-gold mb-6">Quick Links</h4>
                            <ul className="space-y-3 text-sm text-brand-ivory/80">
                                <li><button onClick={() => navigate('home')} className="hover:text-brand-gold transition-colors">Home</button></li>
                                <li><button onClick={() => navigate('products')} className="hover:text-brand-gold transition-colors">Our Products</button></li>
                                <li><button onClick={() => navigate('wholesale')} className="hover:text-brand-gold transition-colors">Wholesale Orders</button></li>
                                <li><button onClick={() => navigate('contact')} className="hover:text-brand-gold transition-colors">Contact Us</button></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="font-heading text-lg text-brand-gold mb-6">Contact Info</h4>
                            <ul className="space-y-3 text-sm text-brand-ivory/80">
                                <li className="flex items-start gap-2">
                                    <Icons.MapPin />
                                    <span>{COMPANY_INFO.address}</span>
                                </li>
                                <li className="flex items-center gap-2">
                                    <Icons.Phone />
                                    <span>{COMPANY_INFO.phoneFormatted}</span>
                                </li>
                            </ul>
                            <div className="mt-6">
                                <Button variant="whatsapp" href={WHATSAPP_LINK} className="!py-2 !px-4 !text-xs w-full max-w-[200px]">
                                    <Icons.WhatsApp /> Chat on WhatsApp
                                </Button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="border-t border-white/10 pt-8 text-center text-xs text-brand-ivory/50 flex flex-col md:flex-row justify-between items-center gap-4">
                        <p>&copy; {new Date().getFullYear()} {COMPANY_INFO.name}. All rights reserved.</p>
                        <p>Designed for premium fragrance experience.</p>
                    </div>
                </div>
            </footer>
        );
        const App = () => {
            const [currentView, setCurrentView] = useState('home');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [showCatalog, setShowCatalog] = useState(false);
            const [catalogPage, setCatalogPage] = useState(1);
            
            const openCatalog = (page = 1) => {
                setCatalogPage(page);
                setShowCatalog(true);
            };
            // Scroll to top on view change
            useEffect(() => {
                window.scrollTo(0, 0);
            }, [currentView, selectedProduct]);
            const navigate = (view) => {
                setSelectedProduct(null);
                setCurrentView(view);
            };
            const viewProduct = (product) => {
                setSelectedProduct(product);
                setCurrentView('product-detail');
            };
            return (
                <div className="font-body text-brand-charcoal bg-brand-ivory min-h-screen">
                    <Navbar navigate={navigate} currentView={currentView} openCatalog={openCatalog} />
                    
                    <main>
                        {currentView === 'home' && (
                            <>
                                <Hero navigate={navigate} openCatalog={openCatalog} />
                                <AboutPreview navigate={navigate} />
                                <ProductSection onViewProduct={viewProduct} />
                                <WhyChooseUs />
                                <WholesaleSection />
                                <ContactSection />
                            </>
                        )}
                        {currentView === 'about' && (
                            <>
                                <div className="pt-32 pb-16 bg-white text-center">
                                    <h1 className="font-heading text-5xl text-brand-maroon mb-6">About Us</h1>
                                    <p className="max-w-2xl mx-auto text-brand-gray px-4">The story of devotion, fragrance, and uncompromising quality.</p>
                                </div>
                                <section className="py-12 bg-brand-ivory">
                                    <div className="container mx-auto px-4 max-w-4xl fade-in">
                                         <div className="bg-white p-8 md:p-12 rounded-3xl shadow-premium mb-12">
                                            <h3 className="font-heading text-2xl text-brand-maroon mb-4 text-center">Leading Manufacturer & Exporter of Premium Perfumed Incense Sticks</h3>
                                            <div className="space-y-4 text-brand-charcoal/80 leading-relaxed text-justify">
                                                <p>Flourish Fragrance, established in 1986, is a trusted name in the manufacturing and export of premium perfumed incense sticks. Under the visionary leadership of Mr. Jagdish Choudhary, the company has built a strong reputation based on quality, innovation, and customer satisfaction. With nearly four decades of experience, we continue to deliver products that reflect excellence, purity, and craftsmanship.</p>
                                                
                                                <p>Every incense stick is manufactured using carefully selected raw materials, advanced production techniques, and premium fragrances to ensure a long-lasting and pleasant aromatic experience. Our commitment to uncompromising quality has earned us the trust of customers across India and international markets.</p>
                                                
                                                <p>Our extensive range of fragrances is thoughtfully developed for daily worship, meditation, spiritual practices, relaxation, and creating a refreshing atmosphere at homes, workplaces, and sacred spaces. Each fragrance is meticulously crafted and thoroughly tested by experienced professionals to ensure superior quality, consistency, and lasting performance.</p>
                                                
                                                <p>Driven by changing market trends and evolving customer preferences, we continuously invest in modern manufacturing technologies, innovative product development, and advanced fragrance retention techniques. Our dedicated team of experts works relentlessly to introduce unique and high-quality products that meet global standards and exceed customer expectations.</p>
                                                
                                                <p>At Flourish Fragrance, we believe that success is built on integrity, ethical business practices, and long-term relationships. We value our employees, encourage continuous growth, and strictly prohibit child labor. Our unwavering commitment to quality, trust, and customer satisfaction remains the foundation of our success.</p>
                                            </div>
                                            <div className="mt-8 text-center border-t border-brand-gold/20 pt-6">
                                                <p className="text-sm text-brand-gray uppercase tracking-widest mb-1">Marketed & Packed By:</p>
                                                <p className="font-heading text-xl text-brand-maroon font-bold">Aditya Perfumary</p>
                                                <p className="text-sm text-brand-charcoal">Malegaon, Akola, Maharashtra - 444108, India</p>
                                            </div>
                                         </div>
                                    </div>
                                </section>
                                <WhyChooseUs />
                            </>
                        )}
                        {currentView === 'products' && (
                            <div className="pt-20">
                                <ProductSection onViewProduct={viewProduct} />
                            </div>
                        )}
                        {currentView === 'wholesale' && (
                            <div className="pt-20">
                                <WholesaleSection />
                                <ContactSection />
                            </div>
                        )}
                        {currentView === 'contact' && (
                            <div className="pt-20">
                                <ContactSection />
                            </div>
                        )}
                        {currentView === 'product-detail' && (
                            <ProductDetailView 
                                product={selectedProduct} 
                                onBack={() => {
                                    setSelectedProduct(null);
                                    // simple history fallback logic
                                    setCurrentView('products');
                                }} 
                            />
                        )}
                    </main>
                    <Footer navigate={navigate} />
                    
                    {/* Catalog Lightbox Overlay */}
                    {showCatalog && (
                        <div className="fixed inset-0 z-[200] bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-4 select-none">
                            {/* Header */}
                            <div className="absolute top-4 left-4 right-4 flex justify-between items-center text-white">
                                <span className="font-heading text-xl md:text-2xl text-brand-gold font-bold">Catalog Page {catalogPage} of 14</span>
                                <button 
                                    onClick={() => setShowCatalog(false)}
                                    className="p-2 rounded-full bg-white/10 hover:bg-white/20 transition-colors text-white"
                                    aria-label="Close Catalog"
                                >
                                    <Icons.Close />
                                </button>
                            </div>
                            
                            {/* Main Image View */}
                            <div className="w-full max-w-4xl max-h-[80vh] flex items-center justify-center relative">
                                {/* Prev Button */}
                                <button 
                                    onClick={() => setCatalogPage(prev => Math.max(1, prev - 1))}
                                    disabled={catalogPage === 1}
                                    className={`absolute left-0 p-3 rounded-full bg-white/10 text-white transition-colors z-10 ${catalogPage === 1 ? 'opacity-20 cursor-not-allowed' : 'hover:bg-white/25'}`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="transform rotate-180"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                                </button>
                                
                                <img 
                                    src={`catalog_page_${catalogPage}.jpg`} 
                                    alt={`Catalog Page ${catalogPage}`} 
                                    className="max-w-[85%] max-h-[75vh] object-contain rounded-lg shadow-2xl border border-white/10"
                                />
                                
                                {/* Next Button */}
                                <button 
                                    onClick={() => setCatalogPage(prev => Math.min(14, prev + 1))}
                                    disabled={catalogPage === 14}
                                    className={`absolute right-0 p-3 rounded-full bg-white/10 text-white transition-colors z-10 ${catalogPage === 14 ? 'opacity-20 cursor-not-allowed' : 'hover:bg-white/25'}`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                                </button>
                            </div>
                            
                            {/* Indicators */}
                            <div className="absolute bottom-4 flex gap-2 overflow-x-auto max-w-[90%] pb-2 no-scrollbar">
                                {Array.from({ length: 14 }, (_, idx) => (
                                    <button 
                                        key={idx}
                                        onClick={() => setCatalogPage(idx + 1)}
                                        className={`w-3 h-3 rounded-full transition-colors flex-shrink-0 ${catalogPage === idx + 1 ? 'bg-brand-gold' : 'bg-white/30 hover:bg-white/50'}`}
                                        aria-label={`Go to page ${idx + 1}`}
                                    ></button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
